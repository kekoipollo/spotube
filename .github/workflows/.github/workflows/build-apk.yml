name: Build Spotube APK

on:
  workflow_dispatch:   # se ejecuta manualmente desde la pestaña Actions
  push:
    branches: [master]

env:
  FLUTTER_VERSION: 3.35.2

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable

      - name: Crear archivo .env
        run: |
          cat > .env <<EOF
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=
          LASTFM_API_SECRET=
          RELEASE_CHANNEL=nightly
          HIDE_DONATIONS=1
          EOF

      - name: Instalar dependencias del proyecto
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=android --arch=all

      - name: Generar keystore propio para firmar
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass android -keypass android \
            -dname "CN=SpotubeMod, OU=Personal, O=Personal, L=NA, S=NA, C=US"
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Compilar APK
        run: dart cli/cli.dart build --arch=all android
        env:
          CHANNEL: nightly

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotube-mod
          path: build/Spotube-android-all-arch.apk
